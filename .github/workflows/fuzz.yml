# SPDX-License-Identifier: MIT OR Apache-2.0

name: Fuzz

on:
    push:
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    CARGO_PROFILE_RELEASE_LTO: "false"
    RBMT_LOG_LEVEL: progress

jobs:
    fuzz:
        name: Fuzz - ${{ matrix.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Deserialize
                      target: deserialize
                    - name: Proof Corruption
                      target: proof-corruption

        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Rust Cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: |
                      . -> target
                      fuzz -> target

            - name: Setup cargo-rbmt
              uses: $/.github/actions/setup-rbmt

            - name: Restore Fuzz Corpus
              id: corpus
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: fuzz/corpus/${{ matrix.target }}
                  key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      fuzz-corpus-v1-${{ matrix.target }}-

            - name: Run Fuzz Target
              id: fuzz
              shell: bash
              run: |
                  nightly=$(cargo rbmt toolchains --nightly)
                  cargo +"$nightly" fuzz run "${{ matrix.target }}" -- -max_total_time=60

            - name: Save Fuzz Corpus
              if: ${{ !cancelled() && steps.fuzz.outcome != 'skipped' && steps.corpus.outcome == 'success' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: fuzz/corpus/${{ matrix.target }}
                  key: ${{ steps.corpus.outputs.cache-primary-key }}

            - name: Upload Crash Artifacts
              if: failure() && steps.fuzz.outcome == 'failure'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: fuzz-artifacts-${{ matrix.target }}
                  path: fuzz/artifacts/${{ matrix.target }}
                  if-no-files-found: ignore
